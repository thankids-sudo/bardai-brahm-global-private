name: Phone preview release (debug APK)

# Builds the debug APK and publishes it as a GitHub pre-release, so testers can download it on a
# phone with a direct link (no GitHub sign-in needed). Testing builds only: debug-signed, not for
# distribution. Never runs for pull requests, so untrusted code never gets write access.
on:
  push:
    branches: [main, feature/phone-preview-release]
    paths: ["android/**", "branding/**", ".github/workflows/android-preview-release.yml"]
  workflow_dispatch:

permissions:
  contents: write   # needed only to create the release

concurrency:
  group: android-preview-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_RUN_NUMBER}"
          apk="BardaiBrahmGlobal-preview-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          cat > notes.md <<NOTES
          **Test build for phones (preview only).** No sign-in, no live data, no data collected.

          Install: download the APK below on your Android phone (Android 8.0 or newer), open it,
          and allow "Install unknown apps" for your browser or Files app when asked.

          If an older preview is installed and this one will not install, uninstall the old one first
          (each test build is signed with a temporary debug key).

          Commit: ${GITHUB_SHA::7} · Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          SHA-256: \`${sha}\`
          NOTES
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease \
             --title "Phone preview ${GITHUB_RUN_NUMBER}" --notes-file notes.md
          echo "Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk}"
