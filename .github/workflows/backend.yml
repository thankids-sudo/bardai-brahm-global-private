name: Database security tests

on:
  push:
    branches: [main, "feature/**"]
    paths: ["backend/**", "supabase/migrations/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "supabase/migrations/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway CI-only database; not a real secret.
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Apply migrations and run security tests
        run: bash backend/db/run_tests.sh
