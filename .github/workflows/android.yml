name: Android debug build

on:
  push:
    branches: [main, "feature/**"]
    paths: ["android/**", ".github/workflows/android.yml", "branding/**"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", "branding/**"]
  workflow_dispatch:

# Least privilege. This workflow uses no secrets, so untrusted pull requests are safe to build.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bardai-brahm-global-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
